# obtained from
# - https://github.com/TechHutTV/homelab/blob/376c5f9/glance.yml
# Note: I installed this with the Proxmox Helper Script. So this config file is in /opt/glance. If you run with docker, there may be multiple configuration files.
theme:
  background-color: 0 0 16
  primary-color: 43 59 81
  positive-color: 61 66 44
  negative-color: 6 96 59
pages:
  - name: Homelab
    width: slim
    hide-desktop-navigation: false
    center-vertically: true
    columns:

      - size: small
        widgets:
          - type: dns-stats
            service: pihole
            url: https://pihole.pve1.homebytes.cc
            token: 12345abcdefghijk

          # - type: repository
          #   repository: TechHutTV/homelab
          #   pull-requests-limit: 5
          #   issues-limit: 3
          #   commits-limit: 3

      - size: full
        widgets:
          - type: search
            autofocus: true
            search-engine: google
            new-tab: true
            bangs:
              - title: YouTube
                shortcut: "@yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Github
                shortcut: "@gh"
                url: https://github.com/search?q={QUERY}&type=repositories
              - title: DuckDuckGo
                shortcut: "@ddg"
                url: https://www.duckduckgo.com/?q={QUERY}

          - type: monitor
            cache: 1m
            title: Services pve1
            sites:
              - title: Proxmox
                url: https://pve1.homebytes.cc
                check-url: https://192.168.1.248:8006
                allow-insecure: true
                icon: di:proxmox
              - title: Pi-Hole
                url: https://pihole.pve1.homebytes.cc/admin
                check-url: https://192.168.1.247:443
                icon: di:pi-hole
              - title: NGINX Proxy Manager
                url: https://proxy.pve1.homebytes.cc
                check-url: http://192.168.1.246:81/
                icon: di:nginx
              - title: Uptime kuma
                url: https://uptime.pve1.homebytes.cc
                check-url: http://192.168.1.245:3001/
                icon: di:uptime-kuma
  #             - title: OctoPrint
  #               url: https://3d.hopki.net/
  #               check-url: http://10.0.0.71
  #               icon: di:octoprint
  #             - title: Proxmox Backup Server
  #               url: https://backup.hopki.net/
  #               check-url: https://10.0.0.251:8007
  #               icon: di:proxmox-light
  #               alt-status-codes:
  #                 - 401
  #                 - 403

          - type: monitor
            cache: 1m
            title: Services rpi1
            sites:
              - title: Pi-Hole
                url: https://pihole.rpi1.homebytes.cc/admin
                check-url: https://192.168.1.253:8443/admin
                icon: di:pi-hole
              - title: NGINX Proxy Manager
                url: https://proxy.rpi1.homebytes.cc
                check-url: http://192.168.1.253:81/
                icon: di:nginx
              - title: Uptime kuma
                url: https://uptime.rpi1.homebytes.cc
                check-url: http://192.168.1.253:3001/
                icon: di:uptime-kuma
